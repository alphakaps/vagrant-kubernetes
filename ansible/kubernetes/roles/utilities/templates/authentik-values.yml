authentik:
    secret_key: "6zWen62yrLGtZJbNae148WF7vimQCaM0Xb2McJvwbT0KSEWH9PkosIs4GQQQldfq2AeaopBxUZFmwUYW"
    # akadmin credentials, applied only when the database is first created (lab only)
    bootstrap_password: "{{ authentik_bootstrap_password | default('') }}"
    bootstrap_email: "admin@traefik.lc"
    # This sends anonymous usage-data, stack traces on errors and
    # performance data to sentry.io, and is fully opt-in
    error_reporting:
        enabled: false
    # 1 web process instead of 2: saves a few hundred MB on the 4 GB nodes
    web:
        workers: 1
    postgresql:
        password: "wylcpVAmRao0bk1m4ZEW9RdG9A2N2dxyxxmCs30UwbjjWL5uXm"

server:
    ingress:
        # Specify kubernetes ingress controller class name
        ingressClassName: traefik
        enabled: true
        hosts:
            - authentik.traefik.lc
    # First boot runs all DB migrations, which takes >10 min on the 2 CPU / 2 GB VMs.
    # Allow 30 min so the probe doesn't kill the server mid-migration (restart loop).
    startupProbe:
        failureThreshold: 180
    resources:
        requests:
            memory: 768Mi

worker:
    startupProbe:
        failureThreshold: 180
    resources:
        requests:
            memory: 768Mi
    # Keep the worker off the server's node so they don't fight for memory
    affinity:
        podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                      topologyKey: kubernetes.io/hostname
                      labelSelector:
                          matchLabels:
                              app.kubernetes.io/name: authentik
                              app.kubernetes.io/component: server
    volumes:
        - name: blueprints-custom
          configMap:
              name: authentik-blueprints
    volumeMounts:
        - name: blueprints-custom
          mountPath: /blueprints/custom
          readOnly: true

postgresql:
    enabled: true
    auth:
        password: "wylcpVAmRao0bk1m4ZEW9RdG9A2N2dxyxxmCs30UwbjjWL5uXm"
    volumePermissions:
        enabled: false
redis:
    enabled: true
